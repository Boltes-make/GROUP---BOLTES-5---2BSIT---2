<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login, registration, and password reset forms">
  <title>Account Forms</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card" aria-labelledby="login-title">
      <h1 id="login-title">Login</h1>
      <form id="login-form">
        <div class="field">
          <label class="field-label" for="login-email">Email Address</label>
          <input class="field-box" id="login-email" type="email" placeholder="Enter email" required>
        </div>
        <div class="field">
          <label class="field-label" for="login-password">Password</label>
          <input class="field-box" id="login-password" type="password" placeholder="Enter password" required>
        </div>
        <button class="action-button primary-button" type="submit">Sign In</button>
      </form>
      <a class="auth-link center-link" href="#reset-password" data-focus="reset-email">Forgot password?</a>
      <p class="switch-text">Don't have an account? <a class="auth-link" href="#register" data-focus="register-name">Register</a></p>
    </section>

    <section class="auth-card" id="register" aria-labelledby="register-title">
      <h1 id="register-title">Register</h1>
      <form id="register-form">
        <div class="field">
          <label class="field-label" for="register-name">Full Name</label>
          <input class="field-box" id="register-name" type="text" placeholder="Enter full name" required>
        </div>
        <div class="field">
          <label class="field-label" for="register-email">Email Address</label>
          <input class="field-box" id="register-email" type="email" placeholder="Enter email" required>
        </div>
        <div class="field">
          <label class="field-label" for="register-password">Password</label>
          <input class="field-box" id="register-password" type="password" placeholder="Create password" required>
        </div>
        <div class="field">
          <label class="field-label" for="register-confirm">Confirm Password</label>
          <input class="field-box" id="register-confirm" type="password" placeholder="Repeat password" required>
        </div>
        <button class="action-button primary-button" type="submit">Create Account</button>
      </form>
      <p class="switch-text">Already have an account? <a class="auth-link" href="#login-title">Login</a></p>
    </section>

    <section class="auth-card" id="reset-password" aria-labelledby="reset-title">
      <h1 id="reset-title">Set / Reset Password</h1>
      <form id="reset-form">
        <div class="field">
          <label class="field-label" for="reset-email">Email Address</label>
          <input class="field-box" id="reset-email" type="email" placeholder="Enter your email" required>
        </div>
        <div class="field">
          <label class="field-label" for="reset-password-input">New Password</label>
          <input class="field-box" id="reset-password-input" type="password" placeholder="Enter new password" required>
        </div>
        <div class="field">
          <label class="field-label" for="reset-confirm">Confirm New Password</label>
          <input class="field-box" id="reset-confirm" type="password" placeholder="Repeat new password" required>
        </div>
        <button class="action-button primary-button" type="submit">Update Password</button>
        <button class="action-button cancel-button" type="reset">Cancel</button>
      </form>
      <a class="auth-link center-link" href="#login-title">Back to Login</a>
    </section>
  </main>
  <script>
    document.querySelectorAll("[data-focus]").forEach(link => {
      link.addEventListener("click", () => {
        setTimeout(() => document.getElementById(link.dataset.focus)?.focus(), 0);
      });
    });

    document.getElementById("login-form").addEventListener("submit", event => {
      event.preventDefault();
      window.location.href = "dashboard.html";
    });

    document.getElementById("register-form").addEventListener("submit", event => {
      event.preventDefault();
      if (document.getElementById("register-password").value !== document.getElementById("register-confirm").value) {
        document.getElementById("register-confirm").setCustomValidity("Passwords do not match.");
        document.getElementById("register-confirm").reportValidity();
        return;
      }
      window.location.href = "dashboard.html";
    });
    document.getElementById("register-confirm").addEventListener("input", event => event.target.setCustomValidity(""));

    document.getElementById("reset-form").addEventListener("submit", event => {
      event.preventDefault();
      if (document.getElementById("reset-password-input").value !== document.getElementById("reset-confirm").value) {
        document.getElementById("reset-confirm").setCustomValidity("Passwords do not match.");
        document.getElementById("reset-confirm").reportValidity();
        return;
      }
      window.location.hash = "login-title";
    });
    document.getElementById("reset-confirm").addEventListener("input", event => event.target.setCustomValidity(""));
  </script>
</body>
</html>
