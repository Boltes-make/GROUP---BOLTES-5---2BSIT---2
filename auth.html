<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login, registration, and password reset forms">
  <title>Account Forms</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card" aria-labelledby="login-title">
      <h1 id="login-title">Login</h1>
      <form>
        <label for="login-email">Email Address</label>
        <input id="login-email" type="email" placeholder="Enter email">

        <label for="login-password">Password</label>
        <input id="login-password" type="password" placeholder="Enter password">

        <button class="primary-button" type="submit">Sign In</button>
      </form>
      <a class="auth-link center-link" href="#reset-password">Forgot password?</a>
      <p class="switch-text">Don't have an account? <a class="auth-link" href="#register">Register</a></p>
    </section>

    <section class="auth-card" id="register" aria-labelledby="register-title">
      <h1 id="register-title">Register</h1>
      <form>
        <label for="register-name">Full Name</label>
        <input id="register-name" type="text" placeholder="Enter full name">

        <label for="register-email">Email Address</label>
        <input id="register-email" type="email" placeholder="Enter email">

        <label for="register-password">Password</label>
        <input id="register-password" type="password" placeholder="Create password">

        <label for="register-confirm">Confirm Password</label>
        <input id="register-confirm" type="password" placeholder="Repeat password">

        <button class="primary-button" type="submit">Create Account</button>
      </form>
      <p class="switch-text">Already have an account? <a class="auth-link" href="#">Login</a></p>
    </section>

    <section class="auth-card" id="reset-password" aria-labelledby="reset-title">
      <h1 id="reset-title">Set / Reset Password</h1>
      <form>
        <label for="reset-email">Email Address</label>
        <input id="reset-email" type="email" placeholder="Enter your email">

        <label for="reset-password-new">New Password</label>
        <input id="reset-password-new" type="password" placeholder="Enter new password">

        <label for="reset-confirm">Confirm New Password</label>
        <input id="reset-confirm" type="password" placeholder="Repeat new password">

        <button class="primary-button" type="submit">Update Password</button>
        <button class="cancel-button" type="button">Cancel</button>
      </form>
      <a class="auth-link center-link" href="#">Back to Login</a>
    </section>
  </main>
</body>
</html>
