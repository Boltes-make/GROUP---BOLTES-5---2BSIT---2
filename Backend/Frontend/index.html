<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f4f6">
    <title>Account access | HOPE Community</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/script.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <a class="brand" href="/" aria-label="HOPE Community home">
        <span class="brand-mark" aria-hidden="true">H</span>
        <span>HOPE<span class="brand-light"> COMMUNITY</span></span>
      </a>

      <div class="auth-grid">
        <section class="auth-card" aria-labelledby="login-title">
          <div class="card-heading">
            <span class="section-label">WELCOME BACK</span>
            <h1 id="login-title">Login</h1>
          </div>
          <form>
            <div class="field">
              <label for="login-email">Email address</label>
              <input id="login-email" type="email" placeholder="Enter email" autocomplete="email" disabled>
            </div>
            <div class="field">
              <label for="login-password">Password</label>
              <input id="login-password" type="password" placeholder="Enter password" autocomplete="current-password" disabled>
            </div>
            <button class="submit-button" type="button" disabled>Sign in</button>
            <p class="card-note">Login is not connected yet.</p>
            <a class="text-link" href="#password-reset" aria-disabled="true">Forgot password?</a>
          </form>
        </section>

        <section class="auth-card register-card" aria-labelledby="register-title">
          <div class="card-heading">
            <span class="section-label">REQUEST ACCESS</span>
            <h2 id="register-title">Register</h2>
          </div>
          <form id="register-form">
            <div class="field">
              <label for="full-name">Full name</label>
              <input id="full-name" name="fullName" type="text" autocomplete="name" placeholder="Enter full name" required maxlength="100">
            </div>
            <div class="field">
              <label for="email">Email address</label>
              <input id="email" name="email" type="email" autocomplete="email" placeholder="Enter email" required maxlength="254">
            </div>
            <div class="field">
              <label for="password">Password</label>
              <div class="password-control">
                <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Create password" required minlength="8" maxlength="128">
                <button class="password-toggle" type="button" data-password-toggle="password" aria-label="Show password" aria-pressed="false">Show</button>
              </div>
            </div>
            <div class="field">
              <label for="confirm-password">Confirm password</label>
              <div class="password-control">
                <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Repeat password" required minlength="8" maxlength="128">
                <button class="password-toggle" type="button" data-password-toggle="confirm-password" aria-label="Show confirmation password" aria-pressed="false">Show</button>
              </div>
            </div>
            <p class="form-message" id="form-message" role="status" aria-live="polite" hidden></p>
            <button class="submit-button" id="submit-button" type="submit">
              <span>Create account</span>
              <span class="button-arrow" aria-hidden="true">→</span>
            </button>
            <p class="card-note">New accounts start pending approval.</p>
          </form>
        </section>

        <section class="auth-card" id="password-reset" aria-labelledby="reset-title">
          <div class="card-heading">
            <span class="section-label">ACCOUNT SECURITY</span>
            <h2 id="reset-title">Set / Reset Password</h2>
          </div>
          <form>
            <div class="field">
              <label for="reset-email">Email address</label>
              <input id="reset-email" type="email" placeholder="Enter your email" autocomplete="email" disabled>
            </div>
            <div class="field">
              <label for="new-password">New password</label>
              <input id="new-password" type="password" placeholder="Enter new password" autocomplete="new-password" disabled>
            </div>
            <div class="field">
              <label for="repeat-new-password">Confirm new password</label>
              <input id="repeat-new-password" type="password" placeholder="Repeat new password" autocomplete="new-password" disabled>
            </div>
            <button class="submit-button" type="button" disabled>Update password</button>
            <button class="secondary-button" type="reset" disabled>Cancel</button>
            <p class="card-note">Password reset is not connected yet.</p>
          </form>
        </section>
      </div>

      <footer class="page-footer">
        <span>© 2026 HOPE Community</span>
        <span>Made for people, built for community.</span>
      </footer>
    </main>
  </body>
</html>
